<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3a3f5c" />
    <title>Offline · EcoSim</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0d1f1a;
        --foreground: #e8f5e9;
        --card: #132b23;
        --border: #1e4a38;
        --accent: #4ade80;
        --muted: #86efac;
        --text-muted: #6b9e7a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 20% 20%, rgba(34, 197, 94, 0.08), transparent 50%),
          radial-gradient(ellipse at 80% 80%, rgba(45, 212, 191, 0.08), transparent 50%),
          var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        text-align: center;
        background: linear-gradient(135deg, #132b23, #0f2219);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      .icon {
        display: inline-grid;
        place-items: center;
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
        font-size: 34px;
        border-radius: 50%;
        background: rgba(74, 222, 128, 0.12);
        border: 1px solid rgba(74, 222, 128, 0.25);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 44px;
        padding: 10px 18px;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        background: linear-gradient(135deg, #16a34a, #0d9488);
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .hint {
        margin: 18px 0 0;
        color: var(--text-muted);
        font-size: 0.78rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Koneksi terputus</h1>
      <p>
        EcoSim sedang offline. Periksa koneksi internet, lalu coba lagi.
        Beberapa fitur, termasuk penyimpanan progress, memerlukan koneksi.
      </p>
      <a href="/">Coba lagi</a>
      <p class="hint">Halaman ini tersedia dari cache EcoSim.</p>
    </main>
  </body>
</html>
